[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noirlycan"
version = "0.3.0"
description = "Windows file-to-memory telemetry prototype using Sysmon and Frida"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "pefile",
]

[project.optional-dependencies]
agent = [
    "frida",
    "pywin32; platform_system == 'Windows'",
]
backend = [
    "email-validator>=2.0",
    "fastapi>=0.115",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest",
    "httpx",
]
lab = [
    "frida",
    "pywin32; platform_system == 'Windows'",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
]
full = [
    "frida",
    "pywin32; platform_system == 'Windows'",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "pytest",
    "httpx",
]

[project.scripts]
noirlycan-agent = "noirlycan_agent.cli:main"
noirlycan-backend = "noirlycan_backend.cli:main"
noirlycan-dashboard = "noirlycan_dashboard.cli:main"

[project.gui-scripts]
noirlycan-agent-desktop = "noirlycan_agent.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noirlycan_agent = ["frida_hooks/*.js"]
