[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noirlycan-telemetry"
version = "0.1.0"
description = "Windows file-to-memory telemetry prototype using Sysmon and Frida"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "channels>=4.0",
    "daphne>=4.0",
    "django>=5.0",
    "django-jet-reboot>=1.3.10",
    "frida",
    "pefile",
    "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
noirlycan-telemetry = "noirlycan_telemetry.cli:main"
noirlycan-storage = "noirlycan_telemetry.services.storage.api:main"
noirlycan-analysis = "noirlycan_telemetry.services.analysis.api:main"
noirlycan-collector-health = "noirlycan_telemetry.services.collector.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noirlycan_telemetry = [
  "frida_hooks/*.js",
  "services/dashboard/templates/*",
  "services/dashboard/static/**",
]
