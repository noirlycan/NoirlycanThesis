[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noirlycan-telemetry"
version = "0.2.0"
description = "Windows file-to-memory telemetry prototype using Sysmon and Frida"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.0",
    "fastapi>=0.115",
    "pefile",
    "pyjwt>=2.8",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
agent = [
    "frida",
    "pywin32; platform_system == 'Windows'",
]
backend = []
dashboard = [
    "channels>=4.0",
    "daphne>=4.0",
    "django>=5.0",
    "django-jet-reboot>=1.3.10",
]
console = [
    "channels>=4.0",
    "daphne>=4.0",
    "django>=5.0",
    "django-jet-reboot>=1.3.10",
]
dev = [
    "pytest",
]
full = [
    "frida",
    "pywin32; platform_system == 'Windows'",
    "channels>=4.0",
    "daphne>=4.0",
    "django>=5.0",
    "django-jet-reboot>=1.3.10",
    "pytest",
]

[project.scripts]
noirlycan-agent = "noirlycan_agent.cli:main"
noirlycan-backend = "noirlycan_backend.cli:main"
noirlycan-dashboard = "noirlycan_dashboard.cli:main"
noirlycan-console = "noirlycan_console.cli:main"
noirlycan-telemetry = "noirlycan_telemetry.cli:main"
noirlycan-storage = "noirlycan_core.storage.api:main"
noirlycan-analysis = "noirlycan_core.analysis.api:main"
noirlycan-collector-health = "noirlycan_agent.collector.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noirlycan_agent = ["frida_hooks/*.js"]
noirlycan_dashboard = [
  "legacy/templates/*",
  "legacy/static/**",
]
