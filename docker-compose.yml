version: "3.9"

# Three deploy units:
#   backend-api   — FastAPI ingest/auth on port 8765
#   dashboard-ui  — React SPA (nginx) on port 8080, proxies /api → backend
#   agent         — Windows VM only (not containerized here)

services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8765:8765"
    volumes:
      - ./logs:/app/logs
      - ./deploy/agent-artifacts:/app/agent-artifacts
    environment:
      - NOIRLYCAN_LOGS_DIR=/app/logs
      - NOIRLYCAN_AGENT_ARTIFACTS_DIR=/app/agent-artifacts
      - NOIRLYCAN_CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080

  dashboard-ui:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8080:80"
    depends_on:
      - backend-api
